name: Build Linux .deb

# macOS 上无法交叉编译 Tauri 的 Linux 包（需要 GTK / WebKitGTK 与 dpkg），
# 所以 Linux 安装包固定由 GitHub 的 Ubuntu runner 产出。
# 触发：推送 v* tag 时自动构建；也可在 Actions 页面手动触发。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '构建完成后把 .deb 上传到这个 Release（留空则只作为 artifact 保存）'
        required: false
        default: ''

jobs:
  deb:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build .deb
        run: npm run tauri build -- --bundles deb

      - name: List artifacts
        run: ls -lh src-tauri/target/release/bundle/deb/

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: lumia-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      # tag 触发时自动传到对应 Release；手动触发时用 inputs.release_tag 指定
      - name: Attach .deb to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          gh release upload "$TAG" src-tauri/target/release/bundle/deb/*.deb --clobber
          echo "uploaded to release $TAG"
