[package]
name = "lumia-launcher"
version = "1.0.0-beta.1"
edition = "2021"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["custom-protocol", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "charset", "system-proxy"] }
sha1 = "0.10"
md5 = "0.7"
hex = "0.4"
glob = "0.3"
open = "5"
anyhow = "1"
zip = "0.6"
futures-util = "0.3"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
aes = "0.8"
rsa = "0.9.10"
base64 = "0.23.1"
rand = "0.8"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
core-graphics = "0.25"
core-foundation-sys = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
