[package]
name = "lumia-launcher"
version = "1.0.0-beta.4"
edition = "2021"
license = "MIT"
description = "Lumia Launcher — 跨平台 Minecraft 启动器（Tauri 2 + Rust + Vue 3）"
repository = "https://github.com/xtg44/Lumia-Launcher"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
# protocol-asset：本地文件（背景图/动图/视频、插件图标）需要它才能通过 asset:// 被 webview 读取，
# 同时带来 http-range，<video> 的分段拉取/拖动进度依赖它。
# 注意：不要在依赖里直接写 "custom-protocol" —— 显式开启会让 tauri 的构建脚本把 dev 判定为 false，
# 于是 `tauri dev` 也要求 frontendDist（dist/）存在并整体嵌入资源，缺目录时 generate_context! 直接 panic。
# 生产构建由 tauri CLI 自动追加 `tauri/custom-protocol`（见 tauri-cli 的 build_options），
# 应用自身保留 [features] custom-protocol 供不经 CLI 的发布构建使用。
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "charset", "system-proxy"] }
sha1 = "0.10"
sha2 = "0.10"
md5 = "0.7"
hex = "0.4"
glob = "0.3"
open = "5"
anyhow = "1"
zip = "0.6"
futures-util = "0.3"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
aes = "0.8"
rsa = "0.9.10"
base64 = "0.23.1"
rand = "0.8"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
core-graphics = "0.25"
core-foundation-sys = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
